<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f5">
  <title>A Little Question 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="floating-hearts" aria-hidden="true"></div>
  <main class="app">
    <div class="tiny-label">A LITTLE SOMETHING FOR YOU ✦</div>
    <section class="card" id="card">
      <div class="sticker" id="sticker" aria-hidden="true">🐻💗</div>
      <p class="eyebrow" id="eyebrow">one tiny question...</p>
      <h1 id="heading">Will you go on a date with me? 💐</h1>
      <p class="subtitle" id="subtitle">I promise good vibes, sweet treats, and lots of smiles.</p>
      <div class="actions" id="actions">
        <button class="btn btn-yes" id="yesBtn">YES! 💖</button>
        <button class="btn btn-no" id="noBtn">No 🙈</button>
      </div>
      <p class="microcopy" id="microcopy">Psst… try moving your cursor over “No” 😉</p>
      <div class="progress" id="progress" aria-label="Progress">
        <span class="active"></span><span></span><span></span><span></span>
      </div>
    </section>
    <p class="footer">made with a little extra 💞</p>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
